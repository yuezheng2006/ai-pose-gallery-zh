<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="application-name" content="POSE Atlas">
<meta name="theme-color" content="#f5f7fb">
<link rel="canonical" href="https://ai-pose.cyber101.cc/studio/">
<link rel="sitemap" type="application/xml" href="/sitemap.xml">
<link rel="alternate" hreflang="zh-CN" href="https://ai-pose.cyber101.cc/studio/">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<meta property="og:site_name" content="POSE Atlas">
<meta property="og:title" content="合成台｜人像、服装、姿势三图合成">
<meta property="og:description" content="把人像、服装、姿势参考图合成为一张角色图。可直连本机 ComfyUI，或使用通义千问、豆包接口。">
<meta property="og:url" content="https://ai-pose.cyber101.cc/studio/">
<meta property="og:image" content="https://pose-images.cyber101.cc/og-cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="合成台｜人像、服装、姿势三图合成">
<meta name="twitter:description" content="把人像、服装、姿势参考图合成为一张角色图。">
<meta name="twitter:image" content="https://pose-images.cyber101.cc/og-cover.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171a21'/%3E%3Ccircle cx='16' cy='9' r='3.2' fill='white'/%3E%3Cpath d='M16 13.5c-2.5 0-4 1.6-4 3.8v3.8h2v7h4v-7h2v-3.8c0-2.2-1.5-3.8-4-3.8z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="site-header">
  <div class="shell topbar">
    <a class="brand" href="/" aria-label="返回参考库首页">
      <span class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="5" r="2.4"/><path d="M12 8v6m0-3-4 2m4-2 4 2m-4 2-3 6m3-6 3 6"/></svg></span>
      <span class="brand-copy"><strong>POSE Atlas</strong></span>
    </a>
    <nav class="gallery-nav" aria-label="图库入口">
      <a href="/">总览</a>
      <a href="/poses/">姿势</a>
      <a href="/costumes/">服装</a>
      <a href="/portraits/">人像</a>
      <a href="/studio/" aria-current="page">合成</a>
    </nav>
    <nav class="top-actions" aria-label="帮助">
      <button class="action-btn" type="button" data-info="guide"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 0 1 4.6 1c0 1.8-2.3 2-2.3 3.6M12 17h.01"/></svg><span class="action-text">使用指南</span></button>
      <button class="action-btn" type="button" data-info="notice"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v5m0 3h.01"/></svg><span class="action-text">注意事项</span></button>
    </nav>
  </div>
  <div class="shell hero studio-hero">
    <div>
      <h1>合成台</h1>
      <p class="hero-desc">从图库选好人像、服装、姿势，或在本页上传。默认直连本机 ComfyUI（Qwen Image Edit 2509，4 步 Lightning）。</p>
    </div>
  </div>
</header>
<main class="shell studio-main">
  <section class="studio-board" aria-label="参考槽位">
    <div class="studio-slots" id="studioSlots"></div>
    <div class="studio-slot-actions">
      <button class="open-btn" type="button" id="randomRecipe">随机填入</button>
      <button class="open-btn" type="button" id="clearRecipe">清空槽位</button>
    </div>
    <label class="studio-field">
      <span>提示词</span>
      <textarea id="promptInput" rows="8" spellcheck="false"></textarea>
    </label>
    <div class="studio-field">
      <span>画面风格</span>
      <div class="segmented" id="stylePreset" role="group" aria-label="画面风格"></div>
    </div>
    <div class="studio-field">
      <span>生成方式</span>
      <div class="segmented" id="providerTabs" role="group" aria-label="生成方式">
        <button type="button" data-provider="comfyui" aria-pressed="true">本机 ComfyUI</button>
        <button type="button" data-provider="qwen" aria-pressed="false">通义千问</button>
        <button type="button" data-provider="doubao" aria-pressed="false">豆包</button>
      </div>
    </div>
    <div class="studio-settings" id="providerSettings"></div>
    <button class="download-btn studio-run" type="button" id="runGenerate">开始合成</button>
    <p class="studio-hint">素材仅供绘画与动作参考。禁止违法用途或未经授权的真人换脸。密钥只保存在本机浏览器。</p>
  </section>
  <section class="studio-result" aria-label="生成结果">
    <div class="studio-canvas" id="resultCanvas">
      <p id="resultEmpty">还没有结果。选齐三张参考图后点开始合成。</p>
      <img id="resultImage" alt="生成结果" hidden>
      <p class="studio-progress" id="resultProgress" hidden></p>
    </div>
    <div class="studio-result-actions">
      <a class="download-btn" id="downloadResult" href="#" download="pose-studio.png" hidden>下载结果</a>
      <p class="studio-error" id="resultError" hidden></p>
    </div>
  </section>
</main>
<footer class="site-footer">
  <div class="shell footer-inner">
    <div class="footer-copy">
      <p><strong>POSE Atlas 中文版</strong> 图片与原始数据版权归原作者ギア所有</p>
      <p>姿势、服装、人像均为 AI 生成参考素材。使用前请阅读注意事项；图片数据的再分发、转载与再售以原作者条款为准。</p>
    </div>
  </div>
</footer>
<input id="slotFile" type="file" accept="image/*" hidden>
<dialog class="info-dialog" id="infoDialog">
  <div class="info-head"><h2 id="infoTitle">使用指南</h2><button class="info-close" id="infoClose" type="button" aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <div class="info-content" id="infoContent"></div>
</dialog>
<script src="/chrome.js"></script>
<script src="/studio-gen.js"></script>
<script src="/studio-app.js"></script>
<script defer src="https://u.authbox.cn/script.js" data-website-id="cde8a23b-4bf6-4ded-8cd9-2c9551dc8d38"></script>
</body>
</html>
